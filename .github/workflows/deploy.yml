name: CI/CD Pipeline - InfraOrchestration

on:
  push:
    branches:
      - cloud
  workflow_dispatch:

jobs:
    deploy-infra:
      name: Apply Selected K8s Manifests to AKS
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v5

        # 1. Autenticação na Azure
        - name: Azure Login
          uses: azure/login@v2.2.0
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

        # 2. Configurar contexto do AKS
        - name: Set AKS Context
          uses: azure/aks-set-context@v3
          with:
            resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
            cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

        # 3. Aplicar apenas ConfigMaps, Secrets, Redis e Kong
        - name: Apply Selected Kubernetes Manifests
          run: |
            echo "Aplicando ConfigMaps e Secrets globais..."
            kubectl apply -f k8s/configmap.yaml
            kubectl apply -f k8s/secrets.yaml
            kubectl apply -f k8s/acr-secret.yaml
            kubectl apply -f k8s/kong-configmap.yaml
            
            echo "Aplicando Redis e Kong..."
            kubectl apply -f k8s/redis.yaml
            kubectl apply -f k8s/kong-deployment.yaml
            
            echo "Acompanhando o status do Kong..."
            kubectl rollout status deployment/kong --timeout=120s || true
