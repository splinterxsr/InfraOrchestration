services:
  kong:
    image: kong:latest
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"                     
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml
    networks:
      - apps_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  localstack:
    image: localstack/localstack:3.3.0
    container_name: localstack-serverless
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,lambda,iam,sns,cloudformation,s3,logs
      - AWS_DEFAULT_REGION=us-east-1
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=60
      - LAMBDA_DOCKER_NETWORK=infraorchestration_apps_network
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack
    networks:
      - apps_network
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - apps_network
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - apps_network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    deploy:
      resources:
        limits:
          memory: 512M

  mysql:
    image: mysql:8.0
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      MYSQL_ROOT_PASSWORD: SenhaAdmin123!
      MYSQL_DATABASE: users_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - apps_network
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -pSenhaAdmin123! -e 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - apps_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo:
    image: mongo:latest
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: r00tp@ss
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - apps_network
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  catalog-api:
    image: splinterxsr/catalogapi:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "5010:8080"
    environment:
      MONGODB_DB: fcg
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: r00tp@ss
      AWS_ENDPOINT: http://localstack:4566
      JWT_ISSUER: FiapCloudGames
      JWT_KEY: M72gsn/ZtfvDSgyBgWNBOYf8HAHBO7FGIwiKPtwipmdMY6ZbdgrJ66yBLnXKk9O8P6fjj7G+BoE5+Ou/xfEgNQ==
      REDIS_HOST: redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - apps_network

  users-api:
    image: anafmel/usersapi:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=users_db;Uid=root;Pwd=SenhaAdmin123!;
      - MYSQL_USER=root             
      - MYSQL_ROOT_PASSWORD=SenhaAdmin123! 
      - MYSQL_DATABASE=users_db
      - MYSQL_HOST=mysql
      - JWT_ISSUER=FiapCloudGames
      - JWT_SECONDS=3600
      - JWT_KEY=M72gsn/ZtfvDSgyBgWNBOYf8HAHBO7FGIwiKPtwipmdMY6ZbdgrJ66yBLnXKk9O8P6fjj7G+BoE5+Ou/xfEgNQ==
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - apps_network

  catalog-worker:
    image: splinterxsr/catalogworker:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      MONGODB_DB: fcg
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: r00tp@ss
      AWS_ENDPOINT: http://localstack:4566
      PAYMENT_QUEUE_NAME: payments-1-queue
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - apps_network

  payments-worker:
    image: anafmel/paymentsworker:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      AWS_ENDPOINT: http://localstack:4566
      ORDER_PLACED_QUEUE_NAME: orders-placed-queue
    depends_on:
      localstack:
        condition: service_started
    networks:
      - apps_network

volumes:
  mysql_data: {}
  mongo_data: {}
  redis_data: {}
  localstack_data: {}

networks:
  apps_network:
    driver: bridge