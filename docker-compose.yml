services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - apps_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  mysql:
    image: mysql:8.0
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SenhaAdmin123!
      MYSQL_DATABASE: users_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - apps_network
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -pSenhaAdmin123! -e 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - apps_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  mongo:
    image: mongo:latest
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: r00tp@ss
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - apps_network
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  catalog-api:
    image: splinterxsr/catalogapi:latest
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always
    ports:
      - "5010:8080"
    environment:
      MONGODB_DB: fcg
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: r00tp@ss
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_HOST: rabbitmq
      JWT_ISSUER: FiapCloudGames
      JWT_KEY: M72gsn/ZtfvDSgyBgWNBOYf8HAHBO7FGIwiKPtwipmdMY6ZbdgrJ66yBLnXKk9O8P6fjj7G+BoE5+Ou/xfEgNQ==
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - apps_network

  users-api:
    image: anafmel/usersapi:latest
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MYSQL_USER: root              
      MYSQL_ROOT_PASSWORD: SenhaAdmin123! 
      MYSQL_DATABASE: users_db
      MYSQL_HOST: mysql
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      JWT_ISSUER: FiapCloudGames
      JWT_SECONDS: 3600
      JWT_KEY: M72gsn/ZtfvDSgyBgWNBOYf8HAHBO7FGIwiKPtwipmdMY6ZbdgrJ66yBLnXKk9O8P6fjj7G+BoE5+Ou/xfEgNQ==
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - apps_network

  catalog-worker:
    image: splinterxsr/catalogworker:latest
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always
    environment:
      MONGODB_DB: fcg
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: r00tp@ss
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_HOST: rabbitmq
      PAYMENT_QUEUE_NAME: payments-1-queue
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - apps_network

  notifications-worker:
    image: splinterxsr/notificationsworker:latest
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_HOST: rabbitmq
      USER_QUEUE_NAME: users-queue
      PAYMENT_QUEUE_NAME: payments-2-queue
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - apps_network

  payments-worker:
    image: anafmel/paymentsworker:latest
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_HOST: rabbitmq
      ORDER_PLACED_QUEUE_NAME: orders-placed-queue
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - apps_network 

volumes:
  rabbitmq_data: {}
  mysql_data: {}
  mongo_data: {}
  redis_data: {}

networks:
  apps_network:
    driver: bridge
