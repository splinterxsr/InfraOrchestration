apiVersion: v1
kind: Secret
metadata:
  name: acr-secret
  namespace: default
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "fiapcg.azurecr.io": {
          "username": "<SEU_AZURE_CLIENT_ID>",
          "password": "<SEU_AZURE_CLIENT_SECRET>"
        }
      }
    }