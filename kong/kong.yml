_format_version: "3.0"
_transform: true

services:
  - name: users-service
    url: http://users-api:8080
    routes:
      - name: users-login-route
        paths:
          - /api/users/login
          - /api/users/register
        strip_path: false
      - name: users-protected-route
        paths:
          - /api/users
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
  - name: catalog-service
    url: http://catalog-api:8080
    routes:
      - name: catalog-protected-route
        paths:
          - /catalog
          - /games
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
consumers:
  - username: fiap-cloud-games-consumer
    jwt_secrets:
      - key: FiapCloudGames
        secret: M72gsn/ZtfvDSgyBgWNBOYf8HAHBO7FGIwiKPtwipmdMY6ZbdgrJ66yBLnXKk9O8P6fjj7G+BoE5+Ou/xfEgNQ==
        algorithm: HS256